enum Role {
  USER
  AGENT
}

enum TicketPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum TicketStatus {
  OPEN
  IN_PROGRESS
  RESOLVED
  CLOSED
}

enum SLAState {
  ON_TRACK
  AT_RISK
  BREACHED
}

type User {
  id: ID!
  name: String!
  email: String!
  role: Role!
  createdAt: String!
  updatedAt: String!
}

type Holiday {
  id: ID!
  date: String!
  name: String!
}

type Comment {
  id: ID!
  content: String!
  author: User!
  createdAt: String!
}

type SLAInfo {
  firstResponseDueAt: String!
  resolutionDueAt: String!

  firstResponseState: SLAState!
  resolutionState: SLAState!
  overallState: SLAState!

  firstResponseRemainingMinutes: Int!
  resolutionRemainingMinutes: Int!
}

type Ticket {
  id: ID!

  title: String!
  description: String!

  priority: TicketPriority!
  status: TicketStatus!

  creator: User!
  assignedAgent: User

  firstResponseAt: String
  resolvedAt: String

  sla: SLAInfo!

  slaDeadline: String!
    @deprecated(
      reason: "Use sla.resolutionDueAt"
    )

  slaState: SLAState!
    @deprecated(
      reason: "Use sla.overallState"
    )

  createdAt: String!
  updatedAt: String!

  comments: [Comment!]!
}

type AuthPayload {
  token: String!
  user: User!
}

type TicketPage {
  items: [Ticket!]!
  page: Int!
  limit: Int!
  total: Int!
  totalPages: Int!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type TicketConnection {
  nodes: [Ticket!]!
  pageInfo: PageInfo!
}

type TicketDashboard {
  openTickets: Int!
  inProgressTickets: Int!
  atRiskTickets: Int!
  breachedTickets: Int!
}

input RegisterInput {
  name: String!
  email: String!
  password: String!
}

input LoginInput {
  email: String!
  password: String!
}

input CreateTicketInput {
  title: String!
  description: String!
  priority: TicketPriority!
}

input AssignTicketInput {
  ticketId: ID!
  agentId: ID!
}

input UpdateTicketStatusInput {
  ticketId: ID!
  status: TicketStatus!
}

input AddCommentInput {
  ticketId: ID!
  content: String!
}

input TicketFilterInput {
  status: TicketStatus
  priority: TicketPriority
  assignedAgentId: ID
  slaState: SLAState
}

type Query {
  health: String!

  me: User!

  ticket(
    id: ID!
  ): Ticket!

  tickets(
    filter: TicketFilterInput
    take: Int = 10
    cursor: String
  ): TicketConnection!

  ticketPage(
    filter: TicketFilterInput
    page: Int = 1
    limit: Int = 10
  ): TicketPage!

  dashboard: TicketDashboard!

  users(
    role: Role
  ): [User!]!

  holidays: [Holiday!]!
}

type Mutation {
  register(
    input: RegisterInput!
  ): AuthPayload!

  login(
    input: LoginInput!
  ): AuthPayload!

  createTicket(
    input: CreateTicketInput!
  ): Ticket!

  assignTicket(
    input: AssignTicketInput!
  ): Ticket!

  changeTicketStatus(
    input: UpdateTicketStatusInput!
  ): Ticket!

  updateTicketStatus(
    input: UpdateTicketStatusInput!
  ): Ticket!
    @deprecated(
      reason: "Use changeTicketStatus"
    )

  resolveTicket(
    ticketId: ID!
  ): Ticket!

  addComment(
    input: AddCommentInput!
  ): Comment!
}